name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: photo-gallery
        run: npm install

      - name: Build Web Assets
        working-directory: photo-gallery
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: photo-gallery
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: photo-gallery/ios/App
        run: pod install

      - name: Build iOS App (.app)
        working-directory: photo-gallery/ios/App
        run: |
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to .ipa
        working-directory: photo-gallery/ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r photo-gallery.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-gallery-ipa
          path: photo-gallery/ios/App/photo-gallery.ipa