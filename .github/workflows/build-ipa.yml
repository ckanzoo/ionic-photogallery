name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Ensure Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build and Package IPA
        run: |
          cd ios/App
          
          # Hanapin kung workspace o xcodeproj ang present
          if [ -d "App.xcworkspace" ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi
          
          echo "Building using $TARGET_FLAG..."
          
          # I-compile ang iOS project bilang Release
          xcodebuild clean build \
            $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Hanapin ang nabuong App.app at i-package bilang .ipa
          mkdir -p Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          
          echo "Found app at $APP_PATH, packaging into IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r photo-gallery.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-gallery-ipa
          path: ios/App/photo-gallery.ipa